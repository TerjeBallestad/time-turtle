name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Tests spawn real servers on OS-assigned ports (see tests/util.js), so they
      # run unmodified on the runner.
      - run: npm test
      - run: npm run build
