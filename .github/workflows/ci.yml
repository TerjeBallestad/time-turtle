name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # Build FIRST: the LAN test in tests/lan-bind.test.js requests `/`, and the server
      # only serves the client when `client/dist` exists.
      - run: npm run build
      # Tests spawn real servers on OS-assigned ports (see tests/util.js), so they
      # run unmodified on the runner.
      - run: npm test

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/terjeballestad/time-turtle:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
